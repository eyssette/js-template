default:
  image: node:22-alpine
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - prepare
  - code
  - build
  - test
  - docs
  - deploy

variables:
  DIST_FOLDER: "dist"
  FILES_TO_COMPRESS: "htm html txt text js css md ico svg"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
  policy: pull

prepare:
  stage: prepare
  cache:
    policy: pull-push
  script:
    - npm ci --cache .npm --prefer-offline --no-audit
  artifacts:
    paths:
      - node_modules
    expire_in: 1 hour

format-check:
  stage: code
  needs:
    - job: prepare
      artifacts: true
  script:
    - npx task format:check

lint:
  stage: code
  needs:
    - job: prepare
      artifacts: true
  script:
    - npx task lint

ecma-source:
  stage: code
  needs:
    - job: prepare
      artifacts: true
  script:
    - npx task ecma:source

build:
  stage: build
  needs:
    - job: prepare
      artifacts: true
  script:
    - npm run build
  artifacts:
    paths:
      - $DIST_FOLDER
    expire_in: 1 day

tests-unit:
  stage: test
  needs:
    - job: prepare
      artifacts: true
  script:
    - npx task tests:unit

ecma-dist:
  stage: test
  needs:
    - job: prepare
      artifacts: true
    - job: build
      artifacts: true
  script:
    - npx task ecma:dist

docs:
  stage: docs
  interruptible: false
  allow_failure: true
  # Cache pour les dépendances npm spécifiques à la génération de la documentation
  cache:
    - key: docs-npm-cache
      paths:
        - docs/doc_build/.npm
      policy: pull-push
  # On vérifie d'abord si le dossier docs et le fichier .deploy-docs-with-markpage existe
  rules:
    - exists:
        - docs
        - docs/.deploy-docs-with-markpage
  # On se place dans le dossier docs, et on va récupérer le script de déploiement de Markpage pour générer la documentation et la déployer sur GitLab Pages
  script:
    - cd docs
    # 1. Sauvegarde des fichiers source de la documentation
    - mkdir -p .my_content
    - cp -r * .my_content
    # 2. Téléchargement et extraction de l'application Markpage
    - mkdir -p doc_build
    - wget https://forge.apps.education.fr/markpage/markpage.forge.apps.education.fr/-/archive/main/markpage.forge.apps.education.fr-main.tar.bz2 -O markpage.tar.bz2
    - tar -xjf markpage.tar.bz2 --strip-components=1 -C doc_build
    # 3. Copie des fichiers sources de la documentation dans l'application Markpage (pour remplacer les fichiers par défaut)
    - cp -r .my_content/* doc_build/
    # 4. Construction du site de documentation
    - cd doc_build
    - npm ci --cache .npm --prefer-offline --no-audit
    - npm run build
    # 5. Nettoyage des fichiers inutiles pour ne garder que les fichiers nécessaires à la documentation
    - rm -rf node_modules .git .gitignore
    - find . -type f ! -name "*.html" ! -name "*.htm" ! -name "*.css" ! -name "*.js" ! -name "*.map" ! -name "*.md" ! -name "*.ico" ! -name "*.png" ! -name "*.jpg" ! -name "*.jpeg" ! -name "*.gif" ! -name "*.svg" ! -name "*.woff" ! -name "*.woff2" ! -name "*.ttf" ! -name "*.eot" -delete
    - find . -type d -empty -delete
    - cd ../..
  artifacts:
    paths:
      - docs/doc_build/
    expire_in: 1 day

compress:
  stage: deploy
  needs:
    - job: build
      artifacts: true
  script:
    # Installation de gzip et brotli pour la compression des fichiers
    - apk add --no-cache gzip brotli
    # Si la documentation a été générée, on la copie dans le dossier de distribution
    - if [ -d "docs/doc_build" ]; then
      mkdir -p $DIST_FOLDER/docs;
      cp -r docs/doc_build/* $DIST_FOLDER/docs/;
      fi
    # Compression des fichiers avec gzip et brotli
    - sh scripts/deploy/compress-assets.sh "$DIST_FOLDER" "$FILES_TO_COMPRESS"
  artifacts:
    paths:
      - "$DIST_FOLDER"
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  interruptible: false
  needs:
    - job: tests-unit
    - job: compress
      artifacts: true
  script:
    # Déplacement du dossier de distribution vers le dossier public pour GitLab Pages
    - mv "$DIST_FOLDER" public
  pages: true
  artifacts:
    paths:
      - public
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
