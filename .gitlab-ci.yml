default:
  image: node:22-alpine
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - prepare
  - code
  - build
  - test
  - deploy

variables:
  DIST_FOLDER: "dist"
  FILES_TO_COMPRESS: "htm html txt text js css md ico svg"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
  policy: pull

prepare:
  stage: prepare
  cache:
    policy: pull-push
  script:
    - npm ci --cache .npm --prefer-offline --no-audit
  artifacts:
    paths:
      - node_modules
    expire_in: 1 hour

code:
  stage: code
  needs:
    - job: prepare
      artifacts: true
  script:
    - npx task format:check
    - npx task lint
    - npx task ecma

build:
  stage: build
  needs:
    - job: prepare
      artifacts: true
  script:
    - npm run build
  artifacts:
    paths:
      - $DIST_FOLDER
    expire_in: 1 day

test:
  stage: test
  needs:
    - job: prepare
    - job: build
      artifacts: true
  script:
    - npx task tests:unit

pages:
  stage: deploy
  interruptible: false
  needs:
    - job: build
      artifacts: true
  script:
    # Installation de gzip et brotli pour la compression des fichiers
    - apk add --no-cache gzip brotli
    # Déplacement du dossier de distribution vers le dossier public pour GitLab Pages
    - mv "$DIST_FOLDER" public
    # Compression des fichiers avec gzip et brotli
    - |
      find_args=()
      for ext in $FILES_TO_COMPRESS; do
        [ ${#find_args[@]} -gt 0 ] && find_args+=(-o)
        find_args+=(-name "*.$ext")
      done
      find public -type f \( "${find_args[@]}" \) -exec gzip -kf {} + -exec brotli -kf {} +
  pages: true
  artifacts:
    paths:
      - public
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
